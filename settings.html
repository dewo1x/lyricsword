<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'">
<title>Wordlight settings</title>
<link rel="stylesheet" href="renderer.css">
<style>
:root{color-scheme:dark;--bg:#0e0c18;--panel:#17142a;--line:rgba(255,255,255,.1);--ink:#f1eefc;--dim:#9a94b8;--acc:#9d7bff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.4 "Segoe UI",system-ui,sans-serif}
#app{display:grid;grid-template-columns:minmax(340px,46%) 1fr;height:100%}
#left{padding:20px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:14px;overflow:auto}
#right{overflow:auto;padding:8px 22px 40px}
h1{font-size:18px;margin:0}
#preview{width:100%;aspect-ratio:16/9;border-radius:12px;border:1px solid var(--line);flex:none}
.sub{color:var(--dim);font-size:12.5px;margin:0}
.presets{display:flex;flex-wrap:wrap;gap:8px}
button{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:7px 12px;cursor:pointer}
button:hover{border-color:var(--acc)}
button.primary{background:var(--acc);color:#120c26;border-color:var(--acc);font-weight:700}
h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--acc);margin:22px 0 6px}
.row{display:grid;grid-template-columns:190px 1fr 64px;align-items:center;gap:12px;padding:7px 0;border-bottom:1px solid var(--line)}
.row label{color:var(--ink)}
.row .val{color:var(--dim);font-size:12.5px;text-align:right;font-variant-numeric:tabular-nums}
.row.off{opacity:.4;pointer-events:none}
input[type=range]{width:100%;accent-color:var(--acc)}
select,input[type=color]{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:inherit}
input[type=color]{padding:2px;width:52px;height:30px}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--acc)}
.note{font-size:12px;color:var(--dim);padding:6px 0}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
@media (max-width:980px){#app{grid-template-columns:1fr;overflow:auto}#left{border-right:0}}
</style>
</head>
<body>
<div id="app">
  <section id="left">
    <h1>Wordlight</h1>
    <div id="preview"></div>
    <p class="sub">Live preview with demo words. Short words stay small, long held words grow big. Changes save automatically and update the fullscreen overlay instantly.</p>
    <div>
      <p class="sub" style="margin-bottom:6px">Presets</p>
      <div class="presets" id="presets"></div>
    </div>
    <div class="presets">
      <button id="restart">Restart preview</button>
      <button id="reset">Reset everything</button>
    </div>
  </section>
  <section id="right"><div id="form"></div></section>
</div>
<script src="renderer.js"></script>
<script src="settings.js"></script>
</body>
</html>
